[package]
name = "particle"
version = "0.1.0"
description = """Particle core"""
documentation = "https://docs.rs/particle/"
authors = ["Simon Johnston <johnstonskj@gmail.com>"]
repository = "https://github.com/johnstonskj/rust-particle.git"
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2021"
publish = true

[package.metadata.docs.rs]
# This sets the default target to `x86_64-unknown-linux-gnu`
# and only builds that target for documentation.
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = ["std", "tracing", "values-timestamp"]
alloc = []
std = ["alloc"]
modeled-properties = []
serde = ["dep:serde", "alloc"]
structured-errors = []
tracing = ["dep:tracing"]
# move to intrinsics values-f16 = ["dep:half"]
values-timestamp = ["std"]

[dependencies]
pastey = "0.2"
# move to intrinsics half = { version = "2.6.0", optional = true }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
], optional = true }
tracing = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
doc-comment = "0.3"
pretty_assertions = "1.4"
tracing-test = "0.2"
