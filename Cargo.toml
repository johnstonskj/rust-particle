[workspace]
resolver = "3"

members = ["particle", "particle-macros", "particle-traits"]

[workspace.dependencies]
document-features = "0.2"
pastey = { version = "0.2" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }


[workspace.package]
edition = "2024"
repository = "https://github.com/johnstonskj/rust-particle"
homepage = "https://simonkjohnston.life/rust-particle"
license = "MIT OR Apache-2.0"


[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
anonymous_parameters = "deny"
bare_trait_objects = "deny"
deref_nullptr = "deny"
drop_bounds = "deny"
dyn_drop = "deny"
elided_lifetimes_in_paths = "warn"
ellipsis_inclusive_range_patterns = "deny"
explicit_outlives_requirements = "warn"
exported_private_dependencies = "deny"
future_incompatible = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
missing_debug_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
noop_method_call = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
